<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Hill Chart</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 14px; background: #fff; color: #222; }

    .label-row {
      display: flex; justify-content: space-between;
      margin-bottom: 4px;
    }
    .label-row span { font-size: 11px; color: #999; }

    svg#hill { display: block; width: 100%; }

    .status {
      font-size: 12px; color: #999;
      margin: 8px 0 14px; min-height: 16px;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th { font-size: 11px; color: #aaa; font-weight: normal;
         text-align: left; padding: 4px 6px;
         border-bottom: 1px solid #eee; }
    td { padding: 6px 6px; border-bottom: 1px solid #f0f0f0;
         font-size: 13px; vertical-align: middle; }
    td input[type=number] {
      width: 52px; font-size: 13px; padding: 3px 5px;
      border: 1px solid #ddd; border-radius: 5px; text-align: right;
    }
    td input[type=range] { width: 100%; }

    .dot { width: 12px; height: 12px; border-radius: 50%;
           display: inline-block; margin-right: 6px; }

    .btn-row { margin-top: 12px; display: flex; gap: 8px; }
    button {
      font-size: 12px; padding: 6px 12px; cursor: pointer;
      border: 1px solid #ddd; border-radius: 6px; background: #fff;
    }
    .primary {
      background: #1a73e8; color: white; border-color: #1a73e8;
    }
  </style>
</head>
<body>

  <div class="label-row">
    <span>Figuring it out →</span>
    <span>← Making it happen</span>
  </div>

  <svg id="hill" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
    <line x1="350" y1="0" x2="350" y2="200"
          stroke="#eee" stroke-width="1.5" stroke-dasharray="5,4"/>
    <path id="hill-path" fill="none" stroke="#ccc" stroke-width="2.5"/>
    <g id="dots-layer"></g>
  </svg>

  <p class="status" id="status">Loading from sheet…</p>

  <table>
    <thead>
      <tr>
        <th>Feature</th>
        <th style="text-align:right">Progress</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="btn-row">
    <button onclick="loadSheet()">↻ Refresh from sheet</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
